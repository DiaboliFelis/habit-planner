default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: <%= ENV["HABIT_PLANNER_DATABASE_PASSWORD"] %>
  host: localhost

development:
  primary:
    <<: *default
    database: habit_planner_development
  cable:
    <<: *default
    database: habit_planner_development_cable
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: habit_planner_test
  cable:
    <<: *default
    database: habit_planner_test_cable
    migrations_paths: db/cable_migrate

production:
  primary: &primary_production
    <<: *default
    database: habit_planner_production
    username: habit_planner
    password: <%= ENV["HABIT_PLANNER_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: habit_planner_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: habit_planner_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: habit_planner_production_cable
    migrations_paths: db/cable_migrate
